<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DivineGrow Admin | Enquiries</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="supabase-config.js" defer></script><script src="admin.js" defer></script></head>
<body><main class="admin-shell"><header class="admin-header"><a href="index.html"><img src="divinegrow-logo.png" alt="DivineGrow LLP"></a><div><span id="user-email"></span><button id="logout" class="button secondary" type="button" hidden>Log out</button></div></header>
<section id="login-view" class="card"><h1>Enquiries dashboard</h1><p>Sign in with your authorised Supabase admin account.</p><form id="login-form"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="button" type="submit">Sign in</button><p id="login-status" class="status" role="alert"></p></form></section>
<section id="dashboard-view" hidden><div class="dashboard-heading"><div><p class="eyebrow">ADMIN</p><h1>Enquiries</h1><p class="dashboard-intro">All website quote and contact submissions</p></div><div class="filters"><label>Status<select id="status-filter"><option value="all">All statuses</option><option value="new">New</option><option value="in_progress">In progress</option><option value="quoted">Quoted</option><option value="closed">Closed</option></select></label><label>Search<input id="search-filter" type="search" placeholder="Name, company or email"></label><button id="refresh" class="button secondary" type="button">Refresh</button></div></div><p id="dashboard-status" class="status" role="status"></p><div id="enquiries" class="enquiries"></div></section></main></body></html>
